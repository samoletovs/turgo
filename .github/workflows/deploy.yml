name: Build & Deploy to Azure Container Apps

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

env:
  CONTAINER_APP_NAME: turgo
  RESOURCE_GROUP: rg-turgo
  # The registry, named rather than kept as a secret. A registry hostname is not a
  # credential - it is public the moment an image is pulled - and keeping it in a
  # secret only made the workflow harder to read and impossible to fix without
  # write access to the secret store.
  ACR_NAME: acragentsfzmqgv
  ACR_LOGIN_SERVER: acragentsfzmqgv.azurecr.io

# Required for OIDC. Without id-token: write the runner cannot mint the token that
# azure/login exchanges, and the login fails with a message about the audience
# rather than about the missing permission.
permissions:
  contents: read
  id-token: write

jobs:
  # ────────────────────────────────────────────
  # Job 1: Lint, Type Check & Test
  # ────────────────────────────────────────────
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run --reporter=verbose --passWithNoTests

      - name: Prettier format check
        run: npx prettier --check "src/**/*.{ts,tsx,json,css}" || true

  # ────────────────────────────────────────────
  # Job 2: Test Build (PRs only — no push)
  # ────────────────────────────────────────────
  build-test:
    name: Test Build
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npx prisma generate

      - name: Next.js production build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://build:build@localhost:5432/build"
          NEXT_TELEMETRY_DISABLED: "1"

  # ────────────────────────────────────────────
  # Job 3: Build & Push Docker Image (main only)
  # ────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # OIDC, not admin credentials. `acragentsfzmqgv` has adminUserEnabled=false,
      # so ACR_USERNAME / ACR_PASSWORD could never have held a working value - this
      # job had been failing on a secret that cannot exist. sp-turgo now holds
      # AcrPush on the registry and a federated credential for this repo, so the
      # token below is short-lived and there is nothing to rotate or leak.
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_LOGIN_SERVER }}/turgo
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────
  # Job 4: Deploy to Azure Container Apps
  # ────────────────────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/turgo:latest

      - name: Sync database schema
        continue-on-error: true
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp exec \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --command "npx --yes prisma db push --accept-data-loss --skip-generate"

      - name: Seed database (categories, locations, plans)
        continue-on-error: true
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp exec \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --command "npx --yes prisma db seed"

      - name: Sync landing page order
        if: success()
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/samoletovs/naurolabs/dispatches \
            -d '{"event_type": "project-deployed", "client_payload": {"project": "turgo"}}' \
            || echo "::warning::Landing page sync dispatch failed"

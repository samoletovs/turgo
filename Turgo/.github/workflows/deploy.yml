name: Build & Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CONTAINER_APP_NAME: turgo
  RESOURCE_GROUP: rg-turgo

jobs:
  # ────────────────────────────────────────────
  # Job 1: Lint, Type Check & Test
  # ────────────────────────────────────────────
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Turgo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Turgo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run --reporter=verbose --passWithNoTests

      - name: Prettier format check
        run: npx prettier --check "src/**/*.{ts,tsx,json,css}" || true

  # ────────────────────────────────────────────
  # Job 2: Test Build (PRs only — no push)
  # ────────────────────────────────────────────
  build-test:
    name: Test Build
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: Turgo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Turgo/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      - name: Next.js production build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://build:build@localhost:5432/build"
          NEXT_TELEMETRY_DISABLED: "1"

  # ────────────────────────────────────────────
  # Job 3: Build & Push Docker Image (main only)
  # ────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/turgo
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: Turgo
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────
  # Job 4: Deploy to Azure Container Apps
  # ────────────────────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Deploy to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/turgo:latest

      - name: Sync database schema
        continue-on-error: true
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp exec \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --command "npx --yes prisma db push --accept-data-loss --skip-generate"

      - name: Seed database (categories, locations, plans)
        continue-on-error: true
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp exec \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --command "npx --yes prisma db seed"

      - name: Notify Telegram (success)
        if: success()
        run: |
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)
          curl -sf -X POST "${{ secrets.TELEGRAM_NOTIFY_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"message\": \"✅ Turgo deployed\\n\\nBranch: ${{ github.ref_name }}\\nCommit: ${COMMIT_MSG}\\nSHA: ${{ github.sha }}\"}" \
            || echo "::warning::Telegram notification failed"

      - name: Notify Telegram (failure)
        if: failure()
        run: |
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)
          curl -sf -X POST "${{ secrets.TELEGRAM_NOTIFY_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"message\": \"❌ Turgo deploy FAILED\\n\\nBranch: ${{ github.ref_name }}\\nCommit: ${COMMIT_MSG}\\nCheck: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "::warning::Telegram notification failed"
